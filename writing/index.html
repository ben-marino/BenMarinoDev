<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing — Ben Marino</title>
<meta name="description" content="Essays, decks, and talks by Ben Marino on AI, architecture, software engineering, and endurance sport.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e14;
    --bg-elevated: #111820;
    --bg-card: #151c27;
    --bg-card-hover: #1a2332;
    --border: #1e2a3a;
    --border-hover: #2a3a4e;
    --text: #f1f5f9;
    --text-muted: #c4d0dc;
    --text-dim: #8d9bab;
    --accent: #14b8a6;
    --accent-glow: #2dd4bf;
    --accent-dim: #0d9488;
    --serif: 'DM Serif Display', Georgia, serif;
    --sans: 'DM Sans', -apple-system, sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
    scrollbar-width: thin;
    scrollbar-color: var(--border) var(--bg);
    color-scheme: dark;
    background: #0a0e14;
  }

  body {
    font-family: var(--sans);
    background: #0a0e14 !important;
    color: var(--text);
    line-height: 1.7;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1;
  }

  .glow {
    position: fixed;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(20, 184, 166, 0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    top: -200px;
    right: -200px;
  }

  .glow-2 {
    top: auto;
    right: auto;
    bottom: 20%;
    left: -300px;
    background: radial-gradient(circle, rgba(59, 130, 246, 0.04) 0%, transparent 70%);
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px;
    position: relative;
    z-index: 2;
  }

  /* ---- BACK LINK ---- */
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--text-dim);
    text-decoration: none;
    padding: 40px 0 0;
    transition: color 0.3s;
  }

  .back-link:hover { color: var(--accent); }
  .back-link::before { content: '←'; }

  /* ---- HEADER ---- */
  header {
    padding: 32px 0 60px;
  }

  .header-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
  }

  h1 {
    font-family: var(--serif);
    font-size: clamp(28px, 5vw, 46px);
    font-weight: 400;
    line-height: 1.2;
    color: #ffffff;
    margin-bottom: 12px;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.1s forwards;
  }

  .header-sub {
    font-size: 15px;
    color: var(--text-dim);
    opacity: 0;
    animation: fadeUp 0.6s ease 0.2s forwards;
  }

  /* ---- DIVIDER ---- */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    margin: 20px 0 50px;
  }

  /* ---- WRITING LIST ---- */
  .writing-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    padding: 20px 0;
    border-bottom: 1px solid var(--border);
    transition: padding-left 0.2s ease;
  }

  .writing-item:first-child {
    border-top: 1px solid var(--border);
  }

  .writing-item:hover {
    padding-left: 8px;
  }

  .writing-item-body {
    flex: 1;
    min-width: 0;
  }

  .writing-title {
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 400;
    color: var(--text);
    text-decoration: none;
    display: block;
    margin-bottom: 4px;
    transition: color 0.2s ease;
  }

  .writing-title:hover { color: var(--accent); }

  .writing-desc {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.5;
  }

  .writing-meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
    flex-shrink: 0;
    padding-top: 3px;
  }

  /* ---- REVEAL ---- */
  .reveal {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* ---- FOOTER ---- */
  footer {
    padding: 40px 0 60px;
    border-top: 1px solid var(--border);
    margin-top: 60px;
  }

  .footer-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
  }

  .footer-content p {
    font-size: 13px;
    color: var(--text-dim);
  }

  .footer-content a {
    color: var(--text-dim);
    text-decoration: none;
    transition: color 0.3s;
  }

  .footer-content a:hover { color: var(--accent); }

  .footer-links {
    display: flex;
    gap: 20px;
  }

  .footer-links a {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    text-decoration: none;
    transition: color 0.3s;
  }

  .footer-links a:hover { color: var(--accent); }

  /* ---- ANIMATIONS ---- */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---- RESPONSIVE ---- */
  @media (max-width: 640px) {
    header { padding: 24px 0 40px; }
    .writing-item { flex-direction: column; gap: 6px; }
    .writing-meta { padding-top: 0; }
    .footer-content { flex-direction: column; text-align: center; }
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f8fafc;
      --bg-elevated: #f1f5f9;
      --bg-card: #ffffff;
      --bg-card-hover: #f8fafc;
      --border: #e2e8f0;
      --border-hover: #cbd5e1;
      --text: #0f172a;
      --text-muted: #475569;
      --text-dim: #64748b;
    }
    html, body { background: #f8fafc !important; }
    h1 { color: #0f172a !important; }
    .glow { background: radial-gradient(circle, rgba(20, 184, 166, 0.08) 0%, transparent 70%); }
    .glow-2 { background: radial-gradient(circle, rgba(59, 130, 246, 0.06) 0%, transparent 70%); }
  }
</style>
</head>
<body>

<div class="glow"></div>
<div class="glow glow-2"></div>

<div class="container">

  <a href="/" class="back-link">Back to home</a>

  <header>
    <div class="header-label">Writing</div>
    <h1>Essays, Decks & Talks</h1>
    <p class="header-sub">Architecture, AI, endurance sport, and the overlap between them.</p>
  </header>

  <div class="divider"></div>

  <section class="reveal" id="writing-list">
    <!-- Entries rendered by the script below. To add a new entry, append an object to the ENTRIES array. -->
  </section>

  <footer>
    <div class="footer-content">
      <p><a href="/">Ben Marino</a> · benmarino.dev</p>
      <div class="footer-links">
        <a href="mailto:ben@mindsetcoach.app">Email</a>
        <a href="https://www.linkedin.com/in/bemarino" target="_blank">LinkedIn</a>
        <a href="https://github.com/ben-marino" target="_blank">GitHub</a>
      </div>
    </div>
  </footer>

</div>

<script>
  // ── Writing entries ───────────────────────────────────────────────────
  // To publish a new entry, add one object here (newest first):
  //   { title, desc, url, meta }
  //   meta = "Category · Month Year"
  // ─────────────────────────────────────────────────────────────────────
  const ENTRIES = [
    {
      title: 'Two Machines, Three Tiers',
      desc:  'The architecture behind a race-day fuel chart: frontier reasoning where it matters, local extraction where it doesn\'t.',
      url:   '/writing/two-machines-three-tiers/',
      meta:  'Architecture Notes · May 2026',
    },
    {
      title: 'The Persona War: Same Data, Opposite Coaching',
      desc:  'How AI coaching persona choice shapes athlete outcomes.',
      url:   '#',
      meta:  'LinkedIn · Feb 2026',
    },
    {
      title: 'The Dumb Zone: Where AI Stops Paying Attention',
      desc:  'Testing the "Lost in the Middle" phenomenon in AI coaching.',
      url:   '#',
      meta:  'LinkedIn · Feb 2026',
    },
    {
      title: 'Context Engineering Lab — Live Workshop',
      desc:  'Talk at AI & Society Brisbane on stress-testing AI coaching reliability.',
      url:   '/talks/ai-society-brisbane/',
      meta:  'Talk · Mar 2026',
    },
    {
      title: 'Digital Wellness & the Socially Fed Pyramid',
      desc:  'Master\'s thesis — surveyed 136 participants on digital wellness and performance.',
      url:   '#',
      meta:  'Thesis · 2025',
    },
  ];

  const list = document.getElementById('writing-list');
  list.innerHTML = ENTRIES.map(e => `
    <div class="writing-item">
      <div class="writing-item-body">
        <a href="${e.url}" class="writing-title">${e.title}</a>
        <div class="writing-desc">${e.desc}</div>
      </div>
      <span class="writing-meta">${e.meta}</span>
    </div>
  `).join('');

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) entry.target.classList.add('visible');
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>

</body>
</html>
